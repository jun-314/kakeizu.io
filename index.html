<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家系図ドラフター</title>
<meta name="description" content="人物を選ぶと周囲のカードに親等が表示される家系図エディタ。自動整列・旧姓・フィルタ・JSON／SVG 書き出しに対応。">
<meta name="theme-color" content="#edf0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='88'>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell" data-mode="tree">
  <header class="bar">
    <div class="brand"><b>家系図ドラフター</b><span>Kakeizu</span></div>
    <div class="modes" id="modes" role="tablist" aria-label="表示の切り替え">
      <button role="tab" data-mode="tree" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.4v3.2M3.6 9.4V7.2h8.8v2.2"/><rect x="6" y="1.2" width="4" height="2.6" rx=".5"/><rect x="1.7" y="9.4" width="3.8" height="2.6" rx=".5"/><rect x="10.5" y="9.4" width="3.8" height="2.6" rx=".5"/></svg><span>家系図</span></button>
      <button role="tab" data-mode="age" aria-selected="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.1"/><path d="M8 4.4V8l2.6 1.6"/></svg><span>年齢管理</span></button>
    </div>
    <div class="grp" data-only="tree">
      <button class="btn" id="b-add" title="人物を追加"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg><span>人物</span></button>
      <button class="btn" id="b-arrange" title="自動整列"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v3M3.5 8.5V7h9v1.5M3.5 8.5v2M8 8.5v2M12.5 8.5v2"/><rect x="6" y="1" width="4" height="2.4" rx=".4"/><rect x="1.6" y="11" width="3.8" height="2.4" rx=".4"/><rect x="6.1" y="11" width="3.8" height="2.4" rx=".4"/><rect x="10.6" y="11" width="3.8" height="2.4" rx=".4"/></svg><span>自動整列</span><b class="auto">AUTO</b></button>
      <button class="btn" id="b-tl" title="時系列で見る"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12.5h12M3.2 12.5V9.4M6.4 12.5V6.2M9.6 12.5V8M12.8 12.5V3.6"/><path d="M3.2 9.4 6.4 6.2 9.6 8l3.2-4.4" stroke-dasharray="2 1.6"/></svg><span>時系列</span></button>
    </div>
    <div class="spacer"></div>
    <div class="grp" data-only="age">
      <button class="btn" id="b-age-data" title="データの書き出し・読み込み"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.8v7.4M5.2 6.6 8 9.4l2.8-2.8M2.4 11v2.2h11.2V11"/></svg><span>データ</span></button>
    </div>
    <div class="grp">
      <button class="btn icon" id="b-theme" title="配色を切り替え"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="4"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/></svg></button>
      <button class="btn icon" id="b-rail" title="サイドパネル" data-only="tree"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M10 2.5v11"/></svg></button>
    </div>
  </header>

  <section class="agew" id="mode-age" hidden><div class="agei" id="agei"></div></section>

  <div class="main" id="mode-tree">
    <div class="canvas" id="canvas">
      <div class="stage" id="stage">
        <svg class="wires" id="wires"></svg>
        <div id="nodes"></div>
      </div>

      <div class="selbar" id="selbar" hidden>
        <span class="lb">選択中</span>
        <button class="who" id="selbar-name" title="詳細を開く"></button>
        <button class="x" id="selbar-x" title="選択を解除" aria-label="選択を解除">×</button>
      </div>
      <div class="tlbar" id="tlbar" hidden>
        <button class="btn icon" id="tl-play" title="再生／停止"><svg class="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8z"/></svg><svg class="i-pause" viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
        <div class="tl-year"><b id="tl-year">—</b><span id="tl-note"></span></div>
        <input type="range" id="tl-range" min="0" max="1" step="1" value="0" aria-label="年">
        <div class="tl-speed" id="tl-speed" role="group" aria-label="速さ"><button data-s="slow">遅</button><button data-s="normal" aria-pressed="true">普通</button><button data-s="fast">早</button></div>
        <button class="btn icon" id="tl-close" title="時系列モードを終了" aria-label="終了">×</button>
      </div>

      <div class="zoombox">
        <button class="btn icon" id="z-out" title="縮小 (−)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 8h9"/></svg></button>
        <span class="pct" id="z-pct" title="クリックで100%">100%</span>
        <button class="btn icon" id="z-in" title="拡大 (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
      </div>
    </div>
    <aside class="rail" id="rail">
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="detail" aria-selected="true">詳細</button>
        <button role="tab" data-tab="filter" aria-selected="false">フィルタ</button>
        <button role="tab" data-tab="view" aria-selected="false">表示</button>
        <button role="tab" data-tab="data" aria-selected="false">データ</button>
      </nav>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div id="modal"></div>
<script src="assets/app.js"></script>
</body>
</html>
